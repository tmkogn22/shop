name: DJANGO REST CI

on:
  push:
    branches: [ feature/add-ci ]
  pull_request:
    branches: [ feature/add-ci, develop ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2

      - name: Set Up Python 3.12
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Set Up .env
        run: |
          echo "${{secrets.ENV_FILE}}" > shop/.env

      - name: Install Docker Compose
        run: |
          sudo apt-get update
          sudo apt-get install -y docker-compose

      - name: Run DB
        run: |
          ls
          docker-compose -f shop/docker-compose.yml up -d db

      - name: Wait for DB
        run: |
          until docker exec -t $(docker ps -q -f name shop_db_1) pg_isready -h localhost 5432; 
            do echo "Waiting for db is ready";
            sleep 5;
          done

      - name: Install Dependencies
        run: |
          python3 -m pip3 install --upgrade pip3
          pip3 install -r requirements.txt
